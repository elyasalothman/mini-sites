<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>فنجان — Finjan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --coffee: #3a2418;
      --gold: #d4a05a;
      --cream: #f0dcc0;
      --ink: #f4e0c4;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100dvh;
      background:
        radial-gradient(ellipse at 50% 0%, #5a3828 0%, var(--coffee) 55%, #24140e 100%);
      color: var(--ink);
      font-family: Amiri, "Noto Naskh Arabic", serif;
    }
    .vault {
      position: fixed;
      bottom: 10px;
      inset-inline-start: 14px;
      z-index: 20;
      color: var(--gold);
      text-decoration: none;
      font-size: 0.85rem;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      opacity: 0.55;
    }
    .vault:hover, .vault:focus-visible { opacity: 1; }
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 1.4rem 1.1rem 5.5rem;
    }
    header h1 {
      margin: 0;
      font-size: clamp(2.2rem, 10vw, 3.4rem);
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    header .en {
      font-family: "Playfair Display", serif;
      font-style: italic;
      color: var(--gold);
      letter-spacing: 0.18em;
      font-size: 0.95rem;
      margin: 0.15rem 0 0;
    }
    .disclaimer {
      margin: 0.85rem 0 1.4rem;
      padding: 0.7rem 0.85rem;
      border: 1px solid color-mix(in srgb, var(--gold) 45%, transparent);
      color: color-mix(in srgb, var(--ink) 85%, var(--gold));
      font-size: 1.02rem;
      line-height: 1.7;
      background: color-mix(in srgb, #000 18%, transparent);
    }
    .disclaimer strong { color: var(--gold); font-weight: 700; }
    .table {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }
    .steam {
      height: 64px;
      width: 160px;
      position: relative;
      pointer-events: none;
    }
    .steam span {
      position: absolute;
      bottom: 0;
      width: 10px;
      height: 48px;
      border-radius: 10px;
      background: linear-gradient(to top, rgba(240,220,190,0), rgba(240,220,190,0.45));
      filter: blur(4px);
      opacity: 0;
    }
    .table.hot .steam span { animation: rise 2.8s ease-in infinite; }
    .steam span:nth-child(1) { right: 58px; animation-delay: 0s; }
    .steam span:nth-child(2) { right: 76px; width: 8px; animation-delay: 0.7s; }
    .steam span:nth-child(3) { right: 42px; width: 7px; animation-delay: 1.3s; }
    @keyframes rise {
      0% { transform: translateY(8px) scaleX(1); opacity: 0; }
      25% { opacity: 0.55; }
      100% { transform: translateY(-52px) scaleX(1.4); opacity: 0; }
    }
    .cup-wrap {
      position: relative;
      width: min(260px, 78vw);
      height: 210px;
    }
    .saucer {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 118%;
      height: 28px;
      background: radial-gradient(ellipse at 50% 40%, #f2e4cc, #c8b090 70%, #a08058);
      border-radius: 50%;
      box-shadow: 0 10px 18px rgba(0,0,0,0.35);
      border: 2px solid var(--gold);
    }
    .cup {
      position: absolute;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      width: 210px;
      height: 148px;
      background:
        linear-gradient(180deg, #f6ead8 0%, #e8d4b4 38%, #c8a878 100%);
      border-radius: 12% 12% 46% 46% / 8% 8% 58% 58%;
      border: 2px solid var(--gold);
      box-shadow:
        inset 0 18px 28px rgba(255,255,255,0.28),
        inset 0 -18px 24px rgba(80,40,10,0.18),
        0 12px 20px rgba(0,0,0,0.28);
    }
    .rim {
      position: absolute;
      top: -10px;
      left: -7%;
      width: 114%;
      height: 28px;
      background: radial-gradient(ellipse at 50% 40%, #f0d090, var(--gold) 45%, #8a6028);
      border-radius: 50%;
      box-shadow: 0 3px 0 #6a4a18, inset 0 2px 4px rgba(255,255,255,0.45);
    }
    .well {
      position: absolute;
      top: 16px;
      left: 10%;
      width: 80%;
      height: 108px;
      background: #2a1810;
      border-radius: 50% 50% 46% 46%;
      overflow: hidden;
      box-shadow: inset 0 8px 16px rgba(0,0,0,0.45);
    }
    .coffee {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 30%, #5a3018, #24140c 70%);
      transition: transform 1.1s ease-in;
      transform-origin: 50% 100%;
    }
    .cup-wrap.drunk .coffee { transform: scaleY(0); }
    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      pointer-events: none;
    }
    .cup-wrap.settled canvas { opacity: 1; }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      margin-top: 1.6rem;
    }
    button {
      font-family: inherit;
      font-size: 1.15rem;
      min-height: 44px;
      padding: 0 1.2rem;
      cursor: pointer;
      touch-action: manipulation;
      color: var(--coffee);
      background: var(--gold);
      border: 1px solid #b07a30;
      border-radius: 999px;
    }
    button.ghost {
      background: transparent;
      color: var(--gold);
      border-color: color-mix(in srgb, var(--gold) 55%, transparent);
    }
    button:disabled { opacity: 0.4; cursor: default; }
    .reading {
      margin-top: 1.6rem;
      min-height: 8rem;
    }
    .reading h2 {
      margin: 0 0 0.5rem;
      font-size: 1.05rem;
      color: var(--gold);
      font-weight: 400;
    }
    .symbols {
      display: grid;
      gap: 0.55rem;
    }
    .sym {
      border: 1px solid color-mix(in srgb, var(--gold) 30%, transparent);
      padding: 0.7rem 0.85rem;
      background: color-mix(in srgb, #000 16%, transparent);
    }
    .sym b {
      display: block;
      font-size: 1.35rem;
      color: var(--cream);
    }
    .sym span { color: color-mix(in srgb, var(--ink) 80%, transparent); font-size: 1.02rem; line-height: 1.65; }
    .empty { color: color-mix(in srgb, var(--ink) 55%, transparent); font-size: 1.05rem; }
    @media (prefers-reduced-motion: reduce) {
      .steam span, .coffee { animation: none !important; transition: none !important; }
      .table.hot .steam span { opacity: 0.25; }
    }
  </style>
</head>
<body>
  <a class="vault" href="../">الخزانة</a>
  <main>
    <header>
      <h1>فنجان</h1>
      <p class="en">Finjan</p>
    </header>
    <p class="disclaimer">
      <strong>مزاح، لا غيب.</strong>
      هذه قراءة ثفلٍ للّعب فقط — ليست علمًا ولا فألًا ولا استخارة. الثفل يقول ما يشاء، وأنت تشرب القهوة.
    </p>
    <div class="table hot" id="table">
      <div class="steam" aria-hidden="true"><span></span><span></span><span></span></div>
      <div class="cup-wrap" id="cup">
        <div class="saucer"></div>
        <div class="cup">
          <div class="rim"></div>
          <div class="well">
            <div class="coffee" id="coffee"></div>
            <canvas id="grounds" width="200" height="120"></canvas>
          </div>
        </div>
      </div>
    </div>
    <div class="actions">
      <button type="button" id="drink">اشرب</button>
      <button type="button" class="ghost" id="fresh" disabled>كأس جديد</button>
    </div>
    <section class="reading" id="reading" aria-live="polite">
      <p class="empty">املأ الفنجان ثم اشرب. بعد أن يستقر الثفل نقرأ ثلاثة رموز — على سبيل المزح.</p>
    </section>
  </main>
  <script>
    (function () {
      const LEX = [
        { k: "طائر", t: "شيء يمرّ ولا يستأذن. ربما خبر، ربما حمام على السطح." },
        { k: "سفر", t: "طريق يُطوى. حتى لو كان إلى بيت الجيران." },
        { k: "مفتاح", t: "بابٌ لم يُفتح بعد، أو درجٌ نسيتَه." },
        { k: "نخلة", t: "أصلٌ ثابت. ظلّ في الحوش، لا عجلة فيه." },
        { k: "موج", t: "قلبٌ يتقلّب. سيهدأ إذا تركتَ الفنجان على الصحن." },
        { k: "بيت", t: "سقفٌ أقرب مما تظن. قهوة الضيف أولى من قهوة السفر." },
        { k: "خاتم", t: "وعدٌ صغير، أو خيط في الإصبع. لا تتزوج الثفل." },
        { k: "قمر", t: "ضوءٌ مستعار. يكفي الليلة، ولا يُدَّخر." },
        { k: "عين", t: "أحدٌ يراك. ربما المرآة، ربما أمك." },
        { k: "كتاب", t: "كلامٌ لم يُقل. اترك هامشًا أبيض." },
        { k: "سفينة", t: "حملٌ ثقيل على ماءٍ رقيق. تمهّل في الشرب." },
        { k: "طريق", t: "خطّ في الثفل كسكة. امشِ فيه أو امسحه بالإصبع." }
      ];
      const canvas = document.getElementById("grounds");
      const ctx = canvas.getContext("2d");
      const cup = document.getElementById("cup");
      const table = document.getElementById("table");
      const reading = document.getElementById("reading");
      const drinkBtn = document.getElementById("drink");
      const freshBtn = document.getElementById("fresh");
      const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let seed = 1;

      function mulberry32(a) {
        return function () {
          let t = (a += 0x6d2b79f5);
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      function sizeCanvas() {
        const r = canvas.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
        const w = Math.max(160, Math.floor(r.width));
        const h = Math.max(96, Math.floor(r.height));
        canvas.width = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        return { w: w, h: h };
      }

      function makeBlobs(rng, w, h) {
        const blobs = [];
        const n = 5 + Math.floor(rng() * 3);
        for (let i = 0; i < n; i++) {
          blobs.push({
            x: 0.18 + rng() * 0.64,
            y: 0.28 + rng() * 0.55,
            r: 10 + rng() * 18,
            mass: 0.6 + rng()
          });
        }
        const parts = [];
        for (let i = 0; i < 70; i++) {
          const b = blobs[i % blobs.length];
          parts.push({
            x: (b.x + (rng() - 0.5) * 0.16) * w,
            y: (b.y + (rng() - 0.5) * 0.14) * h,
            r: 1.2 + rng() * 2.8,
            vx: (rng() - 0.5) * 0.4,
            vy: 0.4 + rng() * 1.1,
            settled: false
          });
        }
        return { blobs: blobs, parts: parts };
      }

      function pickSymbols(blobs, rng) {
        const ranked = blobs.slice().sort(function (a, b) { return b.mass * b.r - a.mass * a.r; });
        const used = {};
        const out = [];
        for (let i = 0; i < ranked.length && out.length < 3; i++) {
          const b = ranked[i];
          const region = (b.y < 0.38 ? 0 : b.y < 0.62 ? 1 : 2) * 3 + (b.x < 0.38 ? 0 : b.x < 0.62 ? 1 : 2);
          let idx = (region + Math.floor(rng() * LEX.length)) % LEX.length;
          let guard = 0;
          while (used[idx] && guard < LEX.length) {
            idx = (idx + 1) % LEX.length;
            guard++;
          }
          used[idx] = true;
          const where = b.y < 0.4 ? "قرب الحافة" : b.y > 0.7 ? "في القاع" : "وسط الفنجان";
          out.push({ sym: LEX[idx], where: where });
        }
        return out;
      }

      function drawParts(parts, w, h, alpha) {
        ctx.clearRect(0, 0, w, h);
        ctx.save();
        ctx.beginPath();
        ctx.ellipse(w / 2, h / 2 + 4, w * 0.46, h * 0.42, 0, 0, Math.PI * 2);
        ctx.clip();
        for (const p of parts) {
          ctx.beginPath();
          ctx.fillStyle = "rgba(42,22,12," + alpha + ")";
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = "rgba(28,14,8," + (0.28 * alpha) + ")";
        for (const p of parts) {
          if (p.r < 2) continue;
          ctx.beginPath();
          ctx.arc(p.x + 0.6, p.y + 0.8, p.r * 1.6, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      function settle(scene, w, h, done) {
        const floor = h * 0.78;
        let frames = 0;
        const max = reduced ? 2 : 70;
        function tick() {
          frames++;
          for (const p of scene.parts) {
            if (p.settled) continue;
            p.vy += 0.12;
            p.x += p.vx;
            p.y += p.vy;
            if (p.y > floor - p.r) {
              p.y = floor - p.r - Math.random() * 8;
              p.vy *= -0.12;
              p.vx *= 0.6;
              if (Math.abs(p.vy) < 0.3) p.settled = true;
            }
            if (p.x < 18) { p.x = 18; p.vx *= -0.4; }
            if (p.x > w - 18) { p.x = w - 18; p.vx *= -0.4; }
          }
          drawParts(scene.parts, w, h, Math.min(1, frames / 12));
          if (frames < max) requestAnimationFrame(tick);
          else done();
        }
        tick();
      }

      function showReading(items) {
        reading.replaceChildren();
        const h = document.createElement("h2");
        h.textContent = "ثلاثة رموز من الثفل — للتسلية";
        reading.appendChild(h);
        const box = document.createElement("div");
        box.className = "symbols";
        items.forEach(function (it) {
          const d = document.createElement("div");
          d.className = "sym";
          d.innerHTML = "<b>" + it.sym.k + "</b><span>" + it.where + ". " + it.sym.t + "</span>";
          box.appendChild(d);
        });
        reading.appendChild(box);
      }

      function drink() {
        drinkBtn.disabled = true;
        table.classList.remove("hot");
        cup.classList.add("drunk");
        const wait = reduced ? 80 : 1150;
        window.setTimeout(function () {
          const dim = sizeCanvas();
          seed = (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0;
          const rng = mulberry32(seed || 1);
          const scene = makeBlobs(rng, dim.w, dim.h);
          cup.classList.add("settled");
          settle(scene, dim.w, dim.h, function () {
            showReading(pickSymbols(scene.blobs, rng));
            freshBtn.disabled = false;
          });
        }, wait);
      }

      function fresh() {
        cup.classList.remove("drunk", "settled");
        table.classList.add("hot");
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        reading.innerHTML = '<p class="empty">فنجان جديد. اشرب حتى الثفل.</p>';
        drinkBtn.disabled = false;
        freshBtn.disabled = true;
      }

      drinkBtn.addEventListener("click", drink);
      freshBtn.addEventListener("click", fresh);
    })();
  </script>
</body>
</html>
