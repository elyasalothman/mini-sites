<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>عطر — أورغن العطّار</title>
  <link rel="canonical" href="https://khazana.alhajda.com/attar/" />

  <meta name="description" content="امزج ثماني نوتات عطرية على ورقة نشاف، سمِّ الخلطة، واحفظ آخر مزج.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
  <style>
    :root { --rose: #a05070; --smoke: #3a2030; --glass: #f6eef2; --gold: #c4a070; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: "IBM Plex Sans Arabic", system-ui, sans-serif;
      background: var(--smoke);
      color: var(--glass);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    .salon {
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      background:
        radial-gradient(ellipse at 50% 0%, #5a3048, transparent 55%),
        var(--smoke);
      padding: 18px 14px 72px;
    }
    header.mark { text-align: center; }
    header.mark h1 {
      font-family: "Playfair Display", Georgia, serif;
      font-weight: 500;
      font-size: clamp(2.2rem, 9vw, 3.6rem);
      letter-spacing: 0.28em;
      color: var(--gold);
    }
    header.mark p { font-size: 0.82rem; opacity: 0.7; margin-top: 4px; letter-spacing: 0.12em; }
    .organ {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
      max-width: 980px;
      margin: 18px auto 0;
      width: 100%;
    }
    @media (min-width: 860px) {
      .organ { grid-template-columns: 1fr 280px 1fr; align-items: center; }
    }
    .col { display: flex; flex-direction: column; gap: 10px; }
    .note {
      background: rgba(246,238,242,0.06);
      border: 1px solid rgba(196,160,112,0.28);
      padding: 8px 10px 10px;
    }
    .note header {
      display: flex; justify-content: space-between; align-items: baseline;
      font-size: 0.85rem; margin-bottom: 4px;
    }
    .note .tier { font-size: 0.68rem; letter-spacing: 0.14em; color: var(--gold); }
    .sw {
      display: inline-block; width: 10px; height: 10px; border-radius: 50%;
      margin-inline-start: 6px; vertical-align: middle;
    }
    input[type="range"] {
      width: 100%; height: 28px; accent-color: var(--rose); cursor: pointer;
    }
    .blot-wrap {
      display: flex; flex-direction: column; align-items: center; gap: 12px;
    }
    canvas#blot {
      width: min(240px, 70vw);
      height: min(240px, 70vw);
      border-radius: 50%;
      display: block;
      box-shadow: 0 0 0 8px rgba(246,238,242,0.08), 0 20px 40px rgba(0,0,0,0.4);
      background: #f3e6ea;
    }
    .namecard {
      background: var(--glass);
      color: var(--smoke);
      padding: 14px 16px;
      width: min(260px, 88vw);
      text-align: center;
      min-height: 88px;
    }
    .namecard em {
      font-family: "Playfair Display", serif;
      font-style: italic;
      font-size: 1.25rem;
      display: block;
    }
    .namecard span { font-size: 0.75rem; opacity: 0.7; }
    .saved { font-size: 0.75rem; opacity: 0.6; text-align: center; }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="salon">
    <header class="mark">
      <h1>عطر</h1>
      <p>أورغن العطّار · قمة · قلب · قاعدة</p>
    </header>
    <div class="organ">
      <div class="col" id="left"></div>
      <div class="blot-wrap">
        <canvas id="blot" width="240" height="240" aria-label="ورقة النشاف"></canvas>
        <div class="namecard">
          <em id="pname">صمت الزجاج</em>
          <span id="psub">حرّك النوتات</span>
        </div>
        <p class="saved" id="saved"></p>
      </div>
      <div class="col" id="right"></div>
    </div>
  </div>
  <a href="../" style="position:fixed;bottom:12px;inset-inline-start:12px;z-index:50;font-size:11px;letter-spacing:.12em;opacity:.4;color:#f6eef2;text-decoration:none">الخزانة</a>
  <script>
  (function () {
    const NOTES = [
      { id: "berg", ar: "برغموت", tier: "قمة", rgb: [170, 186, 72] },
      { id: "salt", ar: "ملح", tier: "قمة", rgb: [216, 208, 200] },
      { id: "rose", ar: "ورد", tier: "قلب", rgb: [176, 64, 96] },
      { id: "jas", ar: "ياسمين", tier: "قلب", rgb: [240, 228, 176] },
      { id: "oud", ar: "عود", tier: "قاعدة", rgb: [74, 40, 24] },
      { id: "musk", ar: "مسك", tier: "قاعدة", rgb: [196, 168, 130] },
      { id: "amb", ar: "عنبر", tier: "قاعدة", rgb: [196, 138, 58] },
      { id: "lea", ar: "جلد", tier: "قاعدة", rgb: [106, 64, 48] }
    ];
    const amt = {};
    NOTES.forEach(n => amt[n.id] = 0);
    amt.rose = 40; amt.oud = 25; amt.berg = 18;

    try {
      const saved = JSON.parse(localStorage.getItem("attar-blend") || "null");
      if (saved && saved.amt) Object.assign(amt, saved.amt);
    } catch (e) {}

    const WORDS = {
      berg: ["شروق", "حمض", "حديقة"],
      salt: ["شاطئ", "ندى", "هواء"],
      rose: ["ورد", "خدّ", "ديوان"],
      jas: ["ليل", "عرس", "قمر"],
      oud: ["خشب", "محراب", "دخان"],
      musk: ["جلد", "دفء", "قرب"],
      amb: ["راتنج", "شمس", "عسل"],
      lea: ["سرج", "مكتبة", "حبر"]
    };
    const PREFIX = ["سكون", "نفس", "ظل", "عهد", "سر"];

    function mixColor() {
      let r = 0, g = 0, b = 0, w = 0;
      NOTES.forEach(n => {
        const a = amt[n.id] / 100;
        r += n.rgb[0] * a; g += n.rgb[1] * a; b += n.rgb[2] * a; w += a;
      });
      if (w < 0.02) return [243, 230, 234];
      return [Math.round(r / w), Math.round(g / w), Math.round(b / w)];
    }

    function nameBlend() {
      const ranked = NOTES.slice().sort((a, b) => amt[b.id] - amt[a.id]);
      const top = ranked.filter(n => amt[n.id] > 8);
      if (!top.length) return { t: "صمت الزجاج", s: "لا نوتة بعد" };
      const a = top[0];
      const b = top[1] || top[0];
      const p = PREFIX[a.ar.length % PREFIX.length];
      const t = p + " " + WORDS[a.id][0] + (b !== a ? " و" + WORDS[b.id][0] : "");
      const groups = {};
      top.forEach(n => { groups[n.tier] = (groups[n.tier] || 0) + amt[n.id]; });
      const lead = Object.keys(groups).sort((x, y) => groups[y] - groups[x])[0];
      return { t: t, s: lead + " · " + top.map(n => n.ar).slice(0, 3).join("، ") };
    }

    const canvas = document.getElementById("blot");
    const ctx = canvas.getContext("2d");
    function sizeCanvas() {
      const r = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.round(r.width * dpr);
      canvas.height = Math.round(r.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      canvas._s = r.width;
    }
    sizeCanvas();
    addEventListener("resize", () => { sizeCanvas(); paint(); });

    function paint() {
      const S = canvas._s || 240;
      const c = mixColor();
      ctx.clearRect(0, 0, S, S);
      ctx.beginPath();
      ctx.arc(S / 2, S / 2, S / 2 - 2, 0, Math.PI * 2);
      ctx.fillStyle = "#f4e8ec";
      ctx.fill();
      const g = ctx.createRadialGradient(S * 0.45, S * 0.4, S * 0.1, S / 2, S / 2, S * 0.48);
      g.addColorStop(0, "rgba(" + c.join(",") + ",0.95)");
      g.addColorStop(0.7, "rgba(" + c.join(",") + ",0.7)");
      g.addColorStop(1, "rgba(" + c.join(",") + ",0.15)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(S / 2, S / 2, S * 0.46, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "rgba(58,32,48,0.15)";
      ctx.beginPath();
      for (let i = 0; i < 7; i++) {
        ctx.moveTo(S / 2, S / 2);
        const a = i * 0.9;
        ctx.quadraticCurveTo(S / 2 + Math.cos(a) * 40, S / 2 + Math.sin(a) * 30, S / 2 + Math.cos(a) * 90, S / 2 + Math.sin(a) * 80);
      }
      ctx.stroke();
    }

    function persist() {
      try {
        localStorage.setItem("attar-blend", JSON.stringify({ amt: amt, at: Date.now() }));
        document.getElementById("saved").textContent = "آخر خلطة محفوظة على هذا الجهاز";
      } catch (e) {
        document.getElementById("saved").textContent = "";
      }
    }

    function refresh() {
      const n = nameBlend();
      document.getElementById("pname").textContent = n.t;
      document.getElementById("psub").textContent = n.s;
      paint();
      persist();
    }

    function slider(n) {
      const wrap = document.createElement("div");
      wrap.className = "note";
      wrap.innerHTML = "<header><span>" + n.ar + "<i class='sw' style='background:rgb(" + n.rgb.join(",") + ")'></i></span><span class='tier'>" + n.tier + "</span></header>";
      const inp = document.createElement("input");
      inp.type = "range"; inp.min = 0; inp.max = 100; inp.value = amt[n.id];
      inp.setAttribute("aria-label", n.ar);
      inp.addEventListener("input", () => { amt[n.id] = +inp.value; refresh(); });
      wrap.appendChild(inp);
      return wrap;
    }

    const left = document.getElementById("left");
    const right = document.getElementById("right");
    NOTES.forEach((n, i) => (i < 4 ? left : right).appendChild(slider(n)));
    refresh();
  })();
  </script>
</body>
</html>
