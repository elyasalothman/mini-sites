<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>الخزانة · Mini Sites</title>
  <link rel="canonical" href="https://khazana.alhajda.com/" />
  <meta name="description" content="دليل 32 موقعًا صغيرًا مستقلًا." />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#f3eee4; --ink:#1c1914; --muted:#5c564c; --line:#d4cbb8; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: "IBM Plex Sans Arabic", system-ui, sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 48px 20px 80px; }
    h1 { font-family: Amiri, serif; font-size: 3rem; margin: 0; line-height: 1; }
    p { color: var(--muted); line-height: 1.6; }
    ol { list-style: none; padding: 0; margin: 32px 0 0; }
    li { border-top: 1px solid var(--line); }
    a { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; padding: 14px 0; min-height: 44px; color: inherit; text-decoration: none; }
    a:hover span.en { opacity: 1; }
    .n { font-variant-numeric: tabular-nums; opacity: 0.4; min-width: 2.2em; }
    .en { opacity: 0.45; font-size: 0.85rem; }
    .home { display: inline-block; margin-bottom: 24px; color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <main>
    <p class="home">الخزانة · Mini Sites</p>
    <h1>الدليل</h1>
    <p>اثنان وثلاثون موقعًا، كل واحد مجلد HTML مستقل.</p>
    <ol id="list"></ol>
  </main>
  <script>
    const SITES = [
      ["mashrabiya","المشربية","Mashrabiya"],["qalam","القلم","Qalam"],["karak","كرك","Karak"],
      ["dunes","كثبان","Dunes"],["abjad","أبجد","Abjad"],["oud","عود","Oud"],
      ["kilim","كليم","Kilim"],["sundial","مزولة","Sundial"],["stoop","انقضاض","Stoop"],
      ["asterism","نجمة","Asterism"],["finjan","فنجان","Finjan"],["caravan","قافلة","Caravan"],
      ["fanous","فانوس","Fanous"],["afterimage","أثر","Afterimage"],["shortwave","موجة","Shortwave"],
      ["waxseal","ختم","Wax Seal"],["balance","ميزان","Balance"],["nakheel","نخيل","Nakheel"],
      ["lampmorse","مصباح","Lamp Morse"],["wadi","وادي","Wadi"],["attar","عطر","Attar"],
      ["deskmoon","قمر المكتب","Desk Moon"],["mirage","سراب","Mirage"],["hourglass","ساعة رمل","Hourglass"],
      ["diwan","ديوان","Diwan"],["sonar","صدى","Sonar"],["arud","عروض","Arud"],
      ["barjeel","برجيل","Barjeel"],["inklab","مختبر الحبر","Ink Lab"],["pearl","لؤلؤ","Pearl"],
      ["zellige","زليج","Zellige"],["harmonograph","منسج","Harmonograph"]
    ];
    const ol = document.getElementById("list");
    SITES.forEach(([slug, ar, en], i) => {
      const li = document.createElement("li");
      li.innerHTML = `<a href="./${slug}/"><span><span class="n">${String(i+1).padStart(2,"0")}</span> ${ar}</span><span class="en">${en}</span></a>`;
      ol.appendChild(li);
    });
  </script>
</body>
</html>
