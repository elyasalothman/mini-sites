<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Desk Moon — قمر المكتب</title>
  <meta name="description" content="A brass paperweight moon on a blotter, showing the real synodic phase for any date." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --blotter: #1c2018;
      --brass: #c4b07a;
      --ivory: #efe6d2;
      --ink: #e8e0c8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      color: var(--ink);
      min-height: 100dvh;
      background:
        repeating-linear-gradient(90deg, #2a2218 0 2px, #241c14 2px 7px),
        #241c14;
      display: grid;
      place-items: center;
      padding: 48px 16px 24px;
    }
    .home {
      position: fixed;
      top: 8px;
      left: 8px;
      z-index: 20;
      font-size: 0.75rem;
      color: var(--ink);
      text-decoration: none;
      opacity: 0.4;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      padding: 0 10px;
    }
    .home:hover, .home:focus-visible { opacity: 1; }
    .desk {
      width: min(560px, 100%);
      background: var(--blotter);
      border-radius: 4px;
      padding: 28px 22px 22px;
      box-shadow:
        0 40px 80px rgba(0, 0, 0, 0.45),
        inset 0 0 0 1px rgba(196, 176, 122, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
      position: relative;
    }
    .desk::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(196, 176, 122, 0.12);
      pointer-events: none;
    }
    h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(1.8rem, 6vw, 2.6rem);
      font-weight: 600;
      color: var(--brass);
      text-align: center;
      letter-spacing: 0.02em;
    }
    .ar {
      text-align: center;
      font-family: "Cormorant Garamond", serif;
      opacity: 0.55;
      font-size: 1rem;
      margin-bottom: 12px;
    }
    .still {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      justify-items: center;
    }
    canvas {
      display: block;
      width: min(72vw, 280px);
      height: min(72vw, 280px);
      filter: drop-shadow(18px 28px 18px rgba(0, 0, 0, 0.55));
    }
    .paper {
      background: var(--ivory);
      color: #2a2418;
      width: 100%;
      padding: 16px 18px 14px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.28);
      transform: rotate(-1.1deg);
    }
    .paper h2 {
      font-family: "Cormorant Garamond", serif;
      font-size: 1.45rem;
      font-weight: 600;
    }
    .paper .ar-name { font-size: 1.05rem; opacity: 0.7; }
    .paper .illum {
      font-variant-numeric: tabular-nums;
      font-size: 0.85rem;
      margin-top: 6px;
    }
    .controls { margin-top: 18px; }
    label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.75;
    }
    input[type="range"] {
      width: 100%;
      height: 44px;
      accent-color: var(--brass);
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }
    button {
      min-height: 44px;
      padding: 0 14px;
      border: 1px solid var(--brass);
      background: transparent;
      color: var(--brass);
      font: inherit;
      font-size: 0.78rem;
      cursor: pointer;
    }
    button:hover { background: rgba(196, 176, 122, 0.12); }
    #dateLabel { font-variant-numeric: tabular-nums; font-size: 0.85rem; }
    @media (prefers-reduced-motion: reduce) {
      .paper { transform: none; }
    }
  </style>
</head>
<body>
  <a class="home" href="../">الخزانة</a>
  <div class="desk">
    <h1>Desk Moon</h1>
    <p class="ar">قمر المكتب</p>
    <div class="still">
      <canvas id="c" width="280" height="280" aria-label="Brass moon paperweight"></canvas>
      <div class="paper">
        <h2 id="phaseEn">Waxing Crescent</h2>
        <p class="ar-name" id="phaseAr">هلال متزايد</p>
        <p class="illum" id="illum">illumination 12%</p>
      </div>
    </div>
    <div class="controls">
      <label>
        Date
        <input id="scrub" type="range" min="-40" max="40" value="0" />
      </label>
      <div class="row">
        <span id="dateLabel"></span>
        <button type="button" id="today">Today</button>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const canvas = document.getElementById("c");
      const scrub = document.getElementById("scrub");
      const dateLabel = document.getElementById("dateLabel");
      const phaseEn = document.getElementById("phaseEn");
      const phaseAr = document.getElementById("phaseAr");
      const illumEl = document.getElementById("illum");
      const SYNODIC = 29.530588853;
      const KNOWN_NEW = Date.UTC(2000, 0, 6, 18, 14, 0);
      const off = document.createElement("canvas");
      let offCtx = off.getContext("2d");

      function fit() {
        const css = canvas.clientWidth;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.max(1, Math.floor(css * dpr));
        canvas.height = Math.max(1, Math.floor(css * dpr));
        const ctx = canvas.getContext("2d");
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        return ctx;
      }
      let ctx = fit();
      window.addEventListener("resize", function () { ctx = fit(); draw(); });

      function moonAge(ms) {
        const days = (ms - KNOWN_NEW) / 86400000;
        return ((days % SYNODIC) + SYNODIC) % SYNODIC;
      }
      function phaseName(age) {
        const t = age / SYNODIC;
        if (t < 0.03 || t >= 0.97) return { en: "New Moon", ar: "محاق" };
        if (t < 0.22) return { en: "Waxing Crescent", ar: "هلال متزايد" };
        if (t < 0.28) return { en: "First Quarter", ar: "تربيع أول" };
        if (t < 0.47) return { en: "Waxing Gibbous", ar: "أحدب متزايد" };
        if (t < 0.53) return { en: "Full Moon", ar: "بدر" };
        if (t < 0.72) return { en: "Waning Gibbous", ar: "أحدب متناقص" };
        if (t < 0.78) return { en: "Last Quarter", ar: "تربيع آخر" };
        return { en: "Waning Crescent", ar: "هلال متناقص" };
      }
      function hash(ix, iy) {
        let n = (ix * 374761393 + iy * 668265263) | 0;
        n = (n ^ (n >> 13)) * 1274126177;
        return ((n ^ (n >> 16)) >>> 0) / 4294967295;
      }
      function currentDate() {
        const d = new Date();
        d.setHours(12, 0, 0, 0);
        d.setDate(d.getDate() + Number(scrub.value));
        return d;
      }

      function draw() {
        const w = canvas.clientWidth;
        const h = canvas.clientHeight;
        const date = currentDate();
        const age = moonAge(date.getTime());
        const tphase = age / SYNODIC;
        const illum = (1 - Math.cos(2 * Math.PI * tphase)) / 2;
        const names = phaseName(age);
        phaseEn.textContent = names.en;
        phaseAr.textContent = names.ar;
        illumEl.textContent = "illumination " + Math.round(illum * 100) + "% · age " + age.toFixed(1) + " d";
        dateLabel.textContent = date.toLocaleDateString(undefined, {
          weekday: "short", year: "numeric", month: "short", day: "numeric"
        });

        ctx.clearRect(0, 0, w, h);
        const cx = w / 2;
        const cy = h / 2 - 4;
        const R = Math.min(w, h) * 0.38;

        ctx.beginPath();
        ctx.ellipse(cx + 10, cy + R * 0.92, R * 0.82, R * 0.14, 0, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(0,0,0,0.35)";
        ctx.fill();

        const lx = Math.sin(2 * Math.PI * tphase);
        const lz = -Math.cos(2 * Math.PI * tphase);
        const ly = 0.12;
        const size = Math.ceil(R * 2 + 4);
        off.width = size;
        off.height = size;
        offCtx = off.getContext("2d");
        const tmp = offCtx.createImageData(size, size);
        const d = tmp.data;
        for (let py = 0; py < size; py++) {
          for (let px = 0; px < size; px++) {
            const nx = (px / (size - 1)) * 2 - 1;
            const ny = (py / (size - 1)) * 2 - 1;
            const rr = nx * nx + ny * ny;
            const o = (py * size + px) * 4;
            if (rr > 1) { d[o + 3] = 0; continue; }
            const nz = Math.sqrt(1 - rr);
            const crater = hash((nx * 18 + 40) | 0, (ny * 18 + 40) | 0);
            const ndot = nx * lx + ny * ly + nz * lz;
            const moonLit = Math.max(0, ndot);
            const studio = Math.max(0, nx * -0.35 + ny * -0.5 + nz * 0.75);
            const rim = Math.pow(1 - nz, 3) * 0.35;
            const shade = moonLit * 0.82 + studio * 0.18 + rim;
            const metal = 0.72 + crater * 0.18;
            d[o] = Math.max(0, Math.min(255, (160 + 70 * metal) * (0.22 + shade * 0.85)));
            d[o + 1] = Math.max(0, Math.min(255, (130 + 55 * metal) * (0.22 + shade * 0.8)));
            d[o + 2] = Math.max(0, Math.min(255, (70 + 30 * metal) * (0.22 + shade * 0.7)));
            d[o + 3] = 255;
          }
        }
        offCtx.putImageData(tmp, 0, 0);
        ctx.drawImage(off, cx - R, cy - R, R * 2, R * 2);

        ctx.beginPath();
        ctx.arc(cx, cy, R, 0, Math.PI * 2);
        ctx.strokeStyle = "rgba(90,70,30,0.55)";
        ctx.lineWidth = 2;
        ctx.stroke();

        const spec = ctx.createRadialGradient(cx - R * 0.3, cy - R * 0.35, 2, cx, cy, R);
        spec.addColorStop(0, "rgba(255,240,200,0.28)");
        spec.addColorStop(0.35, "rgba(255,240,200,0)");
        ctx.fillStyle = spec;
        ctx.beginPath();
        ctx.arc(cx, cy, R, 0, Math.PI * 2);
        ctx.fill();
      }

      scrub.addEventListener("input", draw);
      document.getElementById("today").addEventListener("click", function () {
        scrub.value = "0";
        draw();
      });
      draw();
    })();
  </script>
</body>
</html>
